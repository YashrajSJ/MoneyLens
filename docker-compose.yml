services:
  redis:
    image: redis:7-bookworm
    container_name: moneylens-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - moneylens-redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneylens-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  moneylens-redis-data: